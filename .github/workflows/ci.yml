# Linux CI: builds the debug, release, asan and tsan presets and runs every test headless on lavapipe
# (tsan: ThreadSanitizer, which catches data races on every run, not only when the timing
# exposes them; tools/tsan/), and
# runs each libFuzzer target from its seed corpus (the fuzz preset's tests). Longer fuzzing
# runs nightly in fuzz.yml. bench-callgrind guards the benchmarks' instruction counts, idl
# checks the wire IDL's generated code and evolution rules (and has the base's reader read
# the new fixtures), and actionlint checks the workflows. A manual run can be limited to the benchmark guard.
# The wgpu-native build (vendored crates + Cargo target dir) is cached per preset, keyed on
# the pinned submodule commit and the Rust toolchain, so a warm run only builds our C code.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: Jobs to run
        type: choice
        options: [all, bench]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.preset }})
    if: inputs.jobs != 'bench'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan, fuzz]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          preset: ${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Saved separately from the restore so a failing test still saves the caches.
      - name: Save vendored crates
        if: always() && steps.setup.outputs.vendor-key != '' && steps.setup.outputs.vendor-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/rust-vendor
          key: ${{ steps.setup.outputs.vendor-key }}

      - name: Save wgpu-native build
        if: always() && steps.setup.outputs.cargo-key != '' && steps.setup.outputs.cargo-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/${{ matrix.preset }}/cargo
          key: ${{ steps.setup.outputs.cargo-key }}

      # Sanitizer reports go to each test's output: the CI log shows failing tests' output,
      # LastTest.log keeps every test's (passing ones too, for reports from runs that still
      # passed), and the JUnit file each test's result and output. Failed tests' output is
      # kept whole (CTest truncates it otherwise), so a long report survives.
      - name: Test
        run: >
          ctest --preset ${{ matrix.preset }}
          --output-junit "${{ github.workspace }}/build/${{ matrix.preset }}/ctest-results.xml"
          --test-output-size-failed 16777216

      - name: Upload test and sanitizer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest*.log
            build/${{ matrix.preset }}/ctest-results.xml
            build/${{ matrix.preset }}/tests/**/*.png
            build/${{ matrix.preset }}/fuzz/crash-*
            build/${{ matrix.preset }}/fuzz/leak-*
            build/${{ matrix.preset }}/fuzz/timeout-*
          if-no-files-found: ignore

  # The benchmark guard: instruction counts of the CPU benchmark cases under Callgrind,
  # against bench/baselines.json. Fails when a case is more than 2% above its baseline; a
  # case more than 2% below is reported to be locked in (CONTRIBUTING.md, "Benchmarks"). The
  # counts are uploaded either way, in bench/baselines.json's format: baselines are copied
  # from that artifact, never from a local run.
  bench-callgrind:
    name: bench (callgrind)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          preset: release

      - name: Install valgrind
        run: sudo apt-get install -y --no-install-recommends valgrind

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --target bench_layout bench_text bench_script bench_ui

      - name: Save vendored crates
        if: always() && steps.setup.outputs.vendor-key != '' && steps.setup.outputs.vendor-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/rust-vendor
          key: ${{ steps.setup.outputs.vendor-key }}

      - name: Save wgpu-native build
        if: always() && steps.setup.outputs.cargo-key != '' && steps.setup.outputs.cargo-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/release/cargo
          key: ${{ steps.setup.outputs.cargo-key }}

      - name: Count and compare
        run: python3 -I tools/bench/callgrind.py --build build/release --out callgrind-counts.json

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-callgrind
          path: callgrind-counts.json
          if-no-files-found: ignore

  # The wire IDL (docs/idl.md): the committed generated code is what idl/wire.idl gives, the
  # change keeps the evolution rules against the base (the PR's base, or the previous commit),
  # and the base's reader reads the fixtures added since as those rules say it must.
  idl:
    name: wire IDL
    if: inputs.jobs != 'bench'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generated code is up to date
        run: python3 -I tools/idl/axe_idl.py --check

      - name: Evolution rules against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual run on a branch compares with where it left master.
          [ -n "$BASE" ] || BASE=$(git merge-base origin/master HEAD 2>/dev/null || true)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base commit to compare with"
          else
            python3 -I tools/idl/axe_idl.py --check --compat-base "$BASE"
          fi

      - name: Generator tests
        run: python3 -I tools/idl/test_axe_idl.py

      # The base's own reader, built from its generated codec, reads the command fixtures
      # added or changed since: what the evolution rules promise an older reader.
      - name: Older reader reads the new fixtures
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [ -n "$BASE" ] || BASE=$(git merge-base origin/master HEAD 2>/dev/null || true)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base commit to compare with"
          else
            python3 -I tools/wire/old_reader.py --base "$BASE"
          fi

  # Lints the workflows with actionlint's release binary, pinned by version and checksum.
  actionlint:
    name: actionlint
    if: inputs.jobs != 'bench'
    runs-on: ubuntu-24.04
    env:
      VERSION: 1.7.12
      SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" actionlint

      - name: Lint
        run: ./actionlint -color
