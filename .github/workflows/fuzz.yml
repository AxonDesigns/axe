# Continuous fuzzing: every night (and on demand) each libFuzzer target runs for a fixed
# time, starting from the corpus earlier runs grew plus the committed seeds. The grown corpus
# is minimized and cached for the next run; crash, leak, timeout and OOM inputs are uploaded
# as artifacts and fail the job. To reproduce one, see CONTRIBUTING.md.
name: fuzz

on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per target
        required: true
        default: "10"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [utf8, linebreak, bidi, set_text, commands]
    env:
      TARGET: ${{ matrix.target }}
      MINUTES: ${{ inputs.minutes || '10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          preset: fuzz

      - name: Build
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz --target "fuzz_$TARGET"

      # The ci workflow saves the same wgpu-native cache; this only fills it on a cold start.
      - name: Save wgpu-native build
        if: always() && steps.setup.outputs.cargo-key != '' && steps.setup.outputs.cargo-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/fuzz/cargo
          key: ${{ steps.setup.outputs.cargo-key }}

      # Cache keys are immutable, so each run saves under a new key and the next run restores
      # the newest one by prefix.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        id: fuzz
        run: |
          [[ "$MINUTES" =~ ^[0-9]+$ ]] || { echo "minutes must be a whole number"; exit 1; }
          mkdir -p corpus crashes
          echo "corpus: $(ls corpus | wc -l) cached inputs"
          "build/fuzz/fuzz/fuzz_$TARGET" -max_total_time=$((MINUTES * 60)) -max_len=8192 \
            -timeout=30 -rss_limit_mb=4096 -print_final_stats=1 -artifact_prefix=crashes/ \
            corpus "fuzz/corpus/$TARGET"

      # Keep only inputs that add coverage, so the cache doesn't grow without bound.
      - name: Minimize corpus
        if: always() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure')
        run: |
          mkdir -p merged
          if "build/fuzz/fuzz/fuzz_$TARGET" -merge=1 -max_len=8192 -timeout=30 merged corpus; then
            rm -rf corpus && mv merged corpus
          fi
          echo "corpus: $(ls corpus | wc -l) inputs"

      - name: Save corpus
        if: always() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crashes/
          if-no-files-found: ignore
